<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#125b65" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta
      name="description"
      content="端末の中だけで学ぶ、個人用英語学習アプリ"
    />
    <link rel="icon" href="%BASE_URL%icon-192.png?v=0.3.1" />
    <link
      rel="manifest"
      crossorigin="use-credentials"
      href="%BASE_URL%manifest.webmanifest"
    />
    <link rel="apple-touch-icon" sizes="180x180" href="%BASE_URL%apple-touch-icon.png?v=0.3.1" />
    <meta name="apple-mobile-web-app-title" content="&#8203;" />
    <meta name="app-shell" content="personal-study-v1" />
    <title>&#8203;</title>
  </head>
  <body>
    <header>
      <div class="brand-group">
        <a
          href="#settings"
          class="version-badge"
          aria-label="現在のバージョン %APP_VERSION%・設定で確認"
          >v%APP_VERSION%</a
        >
      </div>
      <span id="connection"></span>
    </header>
    <div id="notice" role="alert" hidden></div>
    <aside id="app-update" class="update-banner" role="status" hidden>
      <p></p>
      <a href="/auth/refresh" class="button" data-refresh-app>最新版を開く</a>
    </aside>
    <main id="app"></main>
    <nav aria-label="メイン">
      <a href="#home">ホーム</a><a href="#setup">学習</a
      ><a href="#search">検索</a><a href="#progress">記録</a
      ><a href="#data">データ</a><a href="#settings">設定</a>
    </nav>
    <script type="module" src="/src/app.js"></script>
  </body>
</html>
