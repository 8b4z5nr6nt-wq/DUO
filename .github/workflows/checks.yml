name: Validate DUO
on:
  workflow_dispatch:
  pull_request:
concurrency:
  group: validate-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run cloudflare:check
      - run: npm run test:oauth-runtime
      - run: npx playwright install --with-deps chromium
      - run: npm run test:update
      - run: npm run test:pages
      - run: npm run test:private
      - run: npm run validate:materials -- examples/materials-fictional.json
      - run: npm run test:e2e
